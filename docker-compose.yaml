services:
  git-backup:
    build: .
    container_name: git-backup
    environment:
      # Which backend to back up: github | azure_devops
      - SOURCE=${SOURCE:-github}

      # GitHub (SOURCE=github)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - REPO_FILTER=${REPO_FILTER:-}
      - INCLUDE_FORKS=${INCLUDE_FORKS:-0}
      - FORCE_ARCHIVE=${FORCE_ARCHIVE:-0}

      # Azure DevOps (SOURCE=azure_devops)
      - DEVOPS_PAT=${DEVOPS_PAT:-}
      - DEVOPS_ORGANIZATION_URL=${DEVOPS_ORGANIZATION_URL:-}

      # SharePoint upload (off by default; set to 1 and fill in the SHAREPOINT_* vars)
      - COPY_ARCHIVES_TO_SHAREPOINT_ENABLED=${COPY_ARCHIVES_TO_SHAREPOINT_ENABLED:-0}
      - SHAREPOINT_URL=${SHAREPOINT_URL:-}
      - SHAREPOINT_DIR=${SHAREPOINT_DIR:-}
      - SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID:-}
      - SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET:-}

      # Paths inside the container (mapped to ./tmp below)
      - PATH_CLONE=/mnt/backup/clone
      - PATH_ARCHIVE=/mnt/backup/archive

      # Set DEBUG_MODE=1 and attach VS Code's "Python Debugger: Remote Attach" on port 5678
      - DEBUG_MODE=${DEBUG_MODE:-0}
    volumes:
      - ./tmp:/mnt/backup
    ports:
      - "5678:5678"
    # To poke around inside the container instead of running the backup:
    #   uncomment the next three lines, then
    #   docker compose --env-file ./configs/github.env up --build -d && docker exec -it git-backup sh
    # stdin_open: true
    # tty: true
    # command: tail -f /dev/null
